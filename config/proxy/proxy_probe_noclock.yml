# PROXY of the pinned frozen-encoder forecasting probe
# (config_probe_forecasting_era5_all_years.yml) for the proxy SSL runs, see
# documentation/PROXY_PLAN.md: same recipe (encoder, latent pre-norm and latent heads
# frozen; a forecast engine, the coordinate embedders, the decoder and the head trained
# from scratch; 3 steps of 6 h; validation Oct-Dec 2023), scaled to the proxy model
# (engine of 2 blocks on 256-d tokens) and to 2015-2022 with 8 x 512 samples.
# Launch: --stage train_continue --from-run-id <proxy SSL run> --config config/proxy/proxy_probe_noclock.yml
#         --nodes 1 --options general.multiprocessing_method=spawn wgtags.exp=proxy_probe_<arm>
#         -- --ntasks=1 --gres=gpu:1 --cpus-per-task=16 --time=01:30:00

fe_num_blocks: 2
fe_num_heads: 8
fe_dropout_rate: 0.1
fe_with_qk_lnorm: True
fe_layer_norm_after_blocks: [1]
fe_impute_latent_noise_std: 5e-5
forecast_att_dense_rate: 1.0

healpix_level: 5

with_mixed_precision: True
with_flash_attention: True
compile_model: False
with_fsdp: False
ddp_find_unused_parameters: False
attention_dtype: bf16
mixed_precision_dtype: bf16
mlp_norm_eps: 1e-5
norm_eps: 1e-4

latent_noise_kl_weight: 0.0
latent_noise_gamma: 2.0
latent_noise_saturate_encodings: 5
latent_noise_use_additive_noise: False
latent_noise_deterministic_latents: True

freeze_modules: ".*encoder.*|.*latent_pre_norm.*|.*latent_heads.*"

norm_type: "LayerNorm"
zarr_store: "zip"

encode_source_times: False

#####################################

streams_directory: "./config/streams/proxy_probe_era5_noclock/"   # ERA5_in (forcing, proxy embedder 256) + ERA5 (diagnostic targets)
streams: ???

general:
  istep: 0
  rank: ???
  world_size: ???
  multiprocessing_method: "spawn"   # forked loader workers hit CUDA in forecast validation
  desc: ""
  run_id: ???
  run_history: []

train_logging:
  terminal: 10
  metrics: 10
  checkpoint: 250
  log_grad_norms: False
  online_probe:
    enabled: false
  grad_share:
    enabled: false
  collapse_monitoring:
    enabled: False

data_loading :
  num_workers: 12
  rng_seed: ???
  repeat_data_in_mini_epoch : False
  memory_pinning: True

training_config:

  training_mode: ["masking"]
  teacher_time_offset: 0
  batch_distinct_dates: false

  context_loss:
    enabled: false

  deep_ssl:
    enabled: false

  num_mini_epochs: 8
  samples_per_mini_epoch: 512
  shuffle: True

  start_date: 2015-01-01T00:00
  end_date: 2022-12-31T00:00

  time_window_step: 06:00:00
  time_window_len: 06:00:00

  learning_rate_scheduling :
    lr_start: 1e-6
    lr_max: 1e-4
    lr_final_decay: 2e-6
    lr_final: 0.0
    num_steps_warmup: 64
    num_steps_cooldown: 128
    policy_warmup: "cosine"
    policy_decay: "constant"
    policy_cooldown: "linear"
    parallel_scaling_policy: "sqrt"

  optimizer:
    grad_clip: 0.25
    weight_decay: 0.1
    log_grad_norms: False
    adamw :
      beta1 : 0.98125
      beta2 : 0.9875
      eps : 1e-08

  losses : {
    "student-teacher": {
        enabled: False,
        type: Disabled,
        },
    "physical": {
        enabled: False,
        type: Disabled,
        },
    "forecast": {
        type: LossPhysical,
        loss_fcts: { "mse": { }, },
        },
    }

  model_input: {
    "random_easy" : {
      enabled: False,
      num_samples: 0,
      },
    "forecasting" : {
      masking_strategy: "forecast",
      },
    }

  target_input: {
    "random_easy_target" : {
      enabled: False,
      },
    }

  forecast :
      time_step: 06:00:00
      num_steps: 3
      offset: 1
      policy: "fixed"


validation_config:

  samples_per_mini_epoch: 128
  shuffle: False

  start_date: 2023-10-01T00:00
  end_date: 2023-12-31T00:00

  validate_with_ema:
    enabled : True
    ema_ramp_up_ratio: 0.09
    ema_halflife_in_thousands: 600

  output : {
    num_samples: 0,
    normalized_samples: False,
    streams: null,
  }

  validate_before_training: False

wgtags:
  org: uv
  issue: null
  exp: proxy_probe
  grid: null
